<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PokerCrew — IRL Poker Tracker &amp; Debt Settler</title>

  <!-- Android PWA & Home Screen Meta Tags -->
  <meta name="theme-color" content="#0f1419" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PokerCrew" />
  <meta name="application-name" content="PokerCrew" />
  <meta name="description" content="Track IRL poker nights, multi-round games, hand highlights, 7-2 bounties, and smart debt settlements." />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22PokerCrew%22%2C%22short_name%22%3A%22PokerCrew%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1419%22%2C%22theme_color%22%3A%22%230f1419%22%2C%22orientation%22%3A%22portrait%22%7D" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            casino: {
              bg: '#0f1419',
              surface: '#182026',
              elevated: '#1f2933',
              emerald: '#10b981',
              crimson: '#ef4444',
              gold: '#f59e0b',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Android Material 3 & Casino Felt Dark-Mode Polish */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #080b0e;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
    }

    /* Tabular numbers on all currency, hand count, and timer readouts */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* Subtle casino felt radial ambient glow */
    .felt-backdrop {
      background-color: #0f1419;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 48%),
        radial-gradient(circle at 85% 20%, rgba(245, 158, 11, 0.045) 0%, transparent 40%);
    }

    /* Tactile Android ripple / press feedback */
    .btn-press {
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-press:active {
      transform: scale(0.96);
    }

    /* Celebratory micro-animations for Rebuys & 7-2 Bounties */
    @keyframes popFlashEmerald {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      40% { transform: scale(1.015); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes popFlashGold {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      40% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .animate-rebuy {
      animation: popFlashEmerald 0.45s ease-out;
    }
    .animate-bounty {
      animation: popFlashGold 0.55s ease-out;
    }

    /* Smooth tab view transition */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tab-enter {
      animation: fadeSlideUp 0.18s ease-out;
    }

    /* Enforce strict LTR direction on numeric inputs regardless of device locale */
    input[dir="ltr"] {
      direction: ltr;
      unicode-bidi: isolate;
      text-align: left;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>

    <!-- Top Material 3 App Bar -->

        <!-- Casino Chip & Spade Emblem -->

    <!-- Prominent One-Tap "Clear Demo Data" Banner on First Visit -->

    // Main persisted application state

    /*************************************************************************

      ];

      const sessions = [
        {
          id: 'sess_1',
          name: 'Thursday Basement Cash',
          date: new Date(now - 18 * dayMs).toISOString(),
          defaultBuyIn: 50,
          gameType: 'Cash Game',

          bountyValue: 10,
          handCount: 84,
          roundCount: 3,
          highlights: [
            { id: 'hl_3', handNumber: 41, roundNumber: 2, tag: 'Monster Pot', playerIds: ['p_maya', 'p_daniel'], potSize: 250, note: 'Maya rivered nut flush to scoop Round 2 finale.' }
          ],
          entries: [
            { playerId: 'p_omer', buyInCount: 3, totalBuyIn: 150, sideBonus: 0, cashOut: 210, net: 60 },
            { playerId: 'p_maya', buyInCount: 3, totalBuyIn: 150, sideBonus: 30, cashOut: 240, net: 120 },
            { playerId: 'p_daniel', buyInCount: 4, totalBuyIn: 200, sideBonus: -10, cashOut: 120, net: -90 },
            { playerId: 'p_noa', buyInCount: 3, totalBuyIn: 150, sideBonus: -10, cashOut: 150, net: -10 },

        },

          highlights: [
            { id: 'hl_4', handNumber: 77, roundNumber: 1, tag: 'Bomb Pot', playerIds: ['p_omer', 'p_noa', 'p_yonatan'], potSize: 420, note: 'Double-board PLO bomb pot chopped between Omer and Noa.' }

        }

      return {
        currency: '₪',
        isSampleData: true,
        hasDismissedSampleBanner: false,
        hasDismissedRoundsTip: false,
        players,
        activeSession: null,
        sessions,

    /*************************************************************************
     * PERSISTENCE & INITIALIZATION
     *************************************************************************/
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          appState = buildSampleData();
          saveState();
        } else {
          const parsed = JSON.parse(raw);
          appState = {
            currency: parsed.currency || '₪',
            isSampleData: Boolean(parsed.isSampleData),
            hasDismissedSampleBanner: Boolean(parsed.hasDismissedSampleBanner),
            hasDismissedRoundsTip: Boolean(parsed.hasDismissedRoundsTip),
            players: Array.isArray(parsed.players) ? parsed.players : [],
            activeSession: parsed.activeSession || null,
            sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
            settlements: Array.isArray(parsed.settlements) ? parsed.settlements : [],
            timerSettings: parsed.timerSettings && Array.isArray(parsed.timerSettings.levels) && parsed.timerSettings.levels.length > 0
              ? parsed.timerSettings
              : { levelDurationSec: 900, levels: JSON.parse(JSON.stringify(DEFAULT_BLIND_LEVELS)) }
          };
        }
      } catch (err) {
        console.error('Error loading saved PokerCrew data:', err);
        appState = buildSampleData();
      }

      uiState.setupSelectedPlayerIds = appState.players.map(p => p.id);
      uiState.setupSessionName = generateDefaultSessionName();
      if (appState.sessions.length > 0) {
        uiState.selectedSettleSessionId = appState.sessions[appState.sessions.length - 1].id;
      }
      timerRuntime.secondsRemaining = appState.timerSettings.levelDurationSec || 900;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('Error saving state:', err);
        showSnackbar('Warning: Storage limit reached on device.');
      }
    }

      return `${days[new Date().getDay()]} Poker Night`;

    /*************************************************************************
     * FORMATTING, SAFE CLIPBOARD & SNACKBAR HELPERS
     *************************************************************************/
    function formatMoney(amount, includeSign = false) {
      const c = appState.currency;
      const num = Number(amount) || 0;
      const absVal = Math.abs(num);
      const formatted = Number.isInteger(absVal) ? absVal.toLocaleString() : absVal.toFixed(2);
      if (includeSign) {
        if (num > 0.005) return `+${c}${formatted}`;
        if (num < -0.005) return `-${c}${formatted}`;
        return `${c}0`;
      }
      return num < -0.005 ? `-${c}${formatted}` : `${c}${formatted}`;
    }

    function formatDateShort(isoStr) {
      try {
        const d = new Date(isoStr);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      } catch {
        return 'Recent';
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getPlayerById(id) {
      return appState.players.find(p => p.id === id) || { id, name: 'Unknown', avatar: '👤' };
    }

    let snackbarTimeout = null;
    function showSnackbar(message) {
      const box = document.getElementById('snackbar');
      const text = document.getElementById('snackbar-text');
      if (!box || !text) return;
      text.textContent = message;
      box.classList.remove('opacity-0', 'translate-y-3');
      box.classList.add('opacity-100', 'translate-y-0');

      if (snackbarTimeout) clearTimeout(snackbarTimeout);
      snackbarTimeout = setTimeout(() => {
        box.classList.remove('opacity-100', 'translate-y-0');
        box.classList.add('opacity-0', 'translate-y-3');
      }, 2800);
    }

    function copyToClipboard(text, successMsg = 'Copied to clipboard! 📋') {
      try {
        const helper = document.getElementById('clipboard-helper');
        helper.value = text;
        helper.style.position = 'fixed';
        helper.style.top = '0';
        helper.style.left = '0';
        helper.style.opacity = '0.01';
        helper.focus();
        helper.select();
        helper.setSelectionRange(0, helper.value.length);
        const ok = document.execCommand('copy');
        helper.style.top = '-999px';
        helper.blur();
        if (ok) {
          showSnackbar(successMsg);
          return true;
        }
      } catch (err) {
        console.error('Copy failed:', err);
      }
      showSnackbar('Could not copy automatically. Please select and copy text.');
      return false;
    }

    /*************************************************************************
     * CUMULATIVE NIGHT MATH HELPERS (SUPPORTS BOTH CONTINUOUS CASH & MULTI-ROUND)
     *************************************************************************/
    function getEntryNightTotals(entry) {
      const bankedBuyIn = Number(entry.bankedBuyIn) || 0;
      const bankedBuyInCount = Number(entry.bankedBuyInCount) || 0;
      const bankedCashOut = Number(entry.bankedCashOut) || 0;
      const bankedSideBonus = Number(entry.bankedSideBonus) || 0;

      const currBuyIn = Number(entry.totalBuyIn) || 0;
      const currBuyInCount = Number(entry.buyInCount) || 0;
      const currSideBonus = Number(entry.sideBonus) || 0;
      const hasCurrCashOut = entry.cashOut !== null && entry.cashOut !== '' && !isNaN(Number(entry.cashOut));
      const currCashOut = hasCurrCashOut ? Number(entry.cashOut) : 0;

      const nightBuyIn = Number((bankedBuyIn + currBuyIn).toFixed(2));
      const nightBuyInCount = bankedBuyInCount + currBuyInCount;
      const nightSideBonus = Number((bankedSideBonus + currSideBonus).toFixed(2));
      const nightCashOut = Number((bankedCashOut + currCashOut).toFixed(2));
      const nightNet = Number((nightCashOut - nightBuyIn + nightSideBonus).toFixed(2));

      return {
        bankedBuyIn,
        bankedCashOut,
        bankedSideBonus,
        currBuyIn,
        currBuyInCount,
        currCashOut,
        hasCurrCashOut,
        nightBuyIn,
        nightBuyInCount,
        nightSideBonus,
        nightCashOut,
        nightNet
      };
    }

    function computeActiveSessionTotals(session) {
      let totalIn = 0;
      let totalOut = 0;
      let anyCurrCashOutEntered = false;

      session.entries.forEach(entry => {
        const t = getEntryNightTotals(entry);
        totalIn += t.nightBuyIn;
        totalOut += t.nightCashOut;
        if (t.hasCurrCashOut || (entry.bankedCashOut && entry.bankedCashOut > 0)) {
          anyCurrCashOutEntered = true;
        }
      });

      totalIn = Number(totalIn.toFixed(2));
      totalOut = Number(totalOut.toFixed(2));
      const diff = Number((totalOut - totalIn).toFixed(2));
      const isBalanced = anyCurrCashOutEntered && Math.abs(diff) < 0.01;

      return { totalIn, totalOut, diff, isBalanced, anyCurrCashOutEntered };
    }

    function computeHandsPerHour(session) {
      const hands = Number(session.handCount) || 0;
      if (hands <= 0 || !session.startedAt) return '—';
      const elapsedMs = Math.max(60 * 1000, Date.now() - new Date(session.startedAt).getTime());
      const elapsedHours = elapsedMs / (1000 * 60 * 60);
      return `${Math.round(hands / elapsedHours)}/hr`;
    }

     * Mutates ONLY targeted text nodes in the DOM. NEVER replaces or blurs the <input>.
     */
    function handleCashOutInput(playerId, inputEl) {
      if (!appState.activeSession) return;
      const entry = appState.activeSession.entries.find(e => e.playerId === playerId);
      if (!entry) return;

      // Sanitize to valid LTR decimal string without disturbing caret unless invalid char typed
      let raw = inputEl.value;
      let cleaned = raw.replace(/[^0-9.]/g, '');
      const firstDot = cleaned.indexOf('.');
      if (firstDot !== -1) {
        cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
      }
      if (cleaned !== raw) {
        const pos = Math.max(0, (inputEl.selectionStart || cleaned.length) - (raw.length - cleaned.length));
        inputEl.value = cleaned;
        try { inputEl.setSelectionRange(pos, pos); } catch {}
      }

      if (cleaned === '') {
        entry.cashOut = null;
      } else {
        const num = Number(cleaned);
        entry.cashOut = isNaN(num) ? null : Math.max(0, num);
      }

      saveState();
      syncLiveTableSummaryDom();
    }

    /**
     * Targeted DOM updater for Table Bank summary, per-player Net P/L, and Fill Remaining buttons
     */
    function syncLiveTableSummaryDom() {
      const session = appState.activeSession;
      if (!session) return;

      const { totalIn, totalOut, diff, isBalanced } = computeActiveSessionTotals(session);
      const roundNum = session.roundNumber || 1;

      const potEl = document.getElementById('bank-total-pot');
      const cashedEl = document.getElementById('bank-total-cashed');
      const diffEl = document.getElementById('bank-diff-value');
      const badgeEl = document.getElementById('bank-status-badge');
      const barEl = document.getElementById('bank-bar-container');

      if (potEl) potEl.textContent = formatMoney(totalIn);
      if (cashedEl) cashedEl.textContent = formatMoney(totalOut);

      if (diffEl) {
        diffEl.textContent = isBalanced ? `${appState.currency}0` : formatMoney(diff, true);
        diffEl.className = `text-sm font-extrabold tabular-nums mt-0.5 ${
          isBalanced ? 'text-emerald-400' : diff > 0 ? 'text-rose-400' : 'text-amber-400'
        }`;
      }

      if (badgeEl) {
        if (isBalanced) {
          badgeEl.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          badgeEl.textContent = '✓ Balanced';
        } else if (diff < 0) {
          badgeEl.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 tabular-nums';
          badgeEl.textContent = `${formatMoney(Math.abs(diff))} on table`;
        } else {
          badgeEl.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30 tabular-nums';
          badgeEl.textContent = `+${formatMoney(diff)} over`;
        }
      }

      if (barEl) {
        barEl.classList.remove('border-emerald-500/40', 'bg-emerald-950/20', 'border-amber-500/35', 'bg-amber-950/15', 'border-rose-500/40', 'bg-rose-950/20');
        if (isBalanced) {
          barEl.classList.add('border-emerald-500/40', 'bg-emerald-950/20');
        } else if (diff < 0) {
          barEl.classList.add('border-amber-500/35', 'bg-amber-950/15');
        } else {
          barEl.classList.add('border-rose-500/40', 'bg-rose-950/20');
        }
      }

      // Update each player's Net display and Fill Remaining button without touching inputs
      session.entries.forEach(entry => {
        const t = getEntryNightTotals(entry);
        const showNet = t.hasCurrCashOut || roundNum > 1 || t.nightSideBonus !== 0;

        const netEl = document.getElementById(`net-display-${entry.playerId}`);
        if (netEl) {
          if (showNet) {
            const colorCls = t.nightNet > 0 ? 'text-emerald-400' : t.nightNet < 0 ? 'text-rose-400' : 'text-slate-300';
            netEl.innerHTML = `
              <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Night Net</div>
              <div class="text-sm font-extrabold tabular-nums ${colorCls}">${formatMoney(t.nightNet, true)}</div>
            `;
          } else {
            netEl.innerHTML = `<span class="inline-block px-2 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 text-[10px] font-bold uppercase tracking-wider">Playing</span>`;
          }
        }

        const fillBtn = document.getElementById(`fill-rem-btn-${entry.playerId}`);
        if (fillBtn) {
          const targetFill = Number((t.currCashOut - diff).toFixed(2));
          const canFill = Math.abs(diff) >= 0.01 && targetFill >= 0;
          if (canFill) {
            fillBtn.classList.remove('hidden');
            fillBtn.textContent = `Fill ${formatMoney(Math.max(0, targetFill))}`;
          } else {
            fillBtn.classList.add('hidden');
          }
        }
      });
    }

    function fillRemainingForPlayer(playerId) {
      if (!appState.activeSession) return;
      const entry = appState.activeSession.entries.find(e => e.playerId === playerId);
      if (!entry) return;

      const { diff } = computeActiveSessionTotals(appState.activeSession);
      const t = getEntryNightTotals(entry);
      const targetFill = Math.max(0, Number((t.currCashOut - diff).toFixed(2)));

      entry.cashOut = targetFill;
      const inp = document.getElementById(`cashout-${playerId}`);
      if (inp) inp.value = String(targetFill);

      saveState();
      syncLiveTableSummaryDom();

      const p = getPlayerById(playerId);
      showSnackbar(`Filled ${formatMoney(targetFill)} for ${p.name} — Table Balanced! ✓`);
    }

    function setPlayerBusted(playerId) {
      if (!appState.activeSession) return;
      const entry = appState.activeSession.entries.find(e => e.playerId === playerId);

      entry.cashOut = 0;

      const inp = document.getElementById(`cashout-${playerId}`);

      syncLiveTableSummaryDom();
      const p = getPlayerById(playerId);
      showSnackbar(`${p.name} marked busted (${formatMoney(0)}).`);

    function confirmBankRoundAndAdvance() {
      if (!appState.activeSession) return;
      const session = appState.activeSession;
      const autoBuyIn = Boolean(document.getElementById('next-round-auto-buyin')?.checked);
      const roundNum = session.roundNumber || 1;

      if (!session.bankedRounds) session.bankedRounds = [];
      const roundSnapshot = {
        roundNumber: roundNum,
        entries: session.entries.map(e => {
          const rIn = Number(e.totalBuyIn) || 0;
          const rOut = e.cashOut !== null && e.cashOut !== '' ? Number(e.cashOut) : 0;
          const rBonus = Number(e.sideBonus) || 0;
          return {
            playerId: e.playerId,
            buyInCount: e.buyInCount,
            totalBuyIn: rIn,
            cashOut: rOut,
            sideBonus: rBonus,
            net: Number((rOut - rIn + rBonus).toFixed(2))
          };
        })
      };
      session.bankedRounds.push(roundSnapshot);

      // Fold Round N into banked cumulative totals and reset active round stacks
      session.entries.forEach(e => {
        const rIn = Number(e.totalBuyIn) || 0;
        const rCount = Number(e.buyInCount) || 0;
        const rOut = e.cashOut !== null && e.cashOut !== '' ? Number(e.cashOut) : 0;
        const rBonus = Number(e.sideBonus) || 0;

        e.bankedBuyIn = Number(((e.bankedBuyIn || 0) + rIn).toFixed(2));
        e.bankedBuyInCount = (e.bankedBuyInCount || 0) + rCount;
        e.bankedCashOut = Number(((e.bankedCashOut || 0) + rOut).toFixed(2));
        e.bankedSideBonus = Number(((e.bankedSideBonus || 0) + rBonus).toFixed(2));

        e.buyInCount = autoBuyIn ? 1 : 0;
        e.totalBuyIn = autoBuyIn ? session.defaultBuyIn : 0;
        e.sideBonus = 0;
        e.cashOut = null;
      });

      session.roundNumber = roundNum + 1;
      session.bountyLog = [];

      saveState();
      closeModal();
      updateChromeUI();
      renderCurrentTab();
      showSnackbar(`Round ${roundNum} banked! Round ${session.roundNumber} is live.`);
    }

      if (!appState.activeSession || !amountPerPlayer || amountPerPlayer <= 0) return;
      const session = appState.activeSession;
      const otherEntries = session.entries.filter(e => e.playerId !== winnerId);
      if (otherEntries.length === 0) return;

      const totalCollected = Number((amountPerPlayer * otherEntries.length).toFixed(2));
      session.entries.forEach(entry => {
        if (entry.playerId === winnerId) {
          entry.sideBonus = Number(((entry.sideBonus || 0) + totalCollected).toFixed(2));
        } else {
          entry.sideBonus = Number(((entry.sideBonus || 0) - amountPerPlayer).toFixed(2));
        }
      });

      if (!session.bountyLog) session.bountyLog = [];
      session.bountyLog.push({
        id: 'b_' + Date.now(),
        winnerId,
        amountPerPlayer,
        payerIds: otherEntries.map(e => e.playerId),
        totalWon: totalCollected
      });

      uiState.lastAnimatedEntryId = winnerId;
      uiState.lastAnimationType = 'bounty';
      saveState();
      renderCurrentTab();

      const winner = getPlayerById(winnerId);
      showSnackbar(`🃏 7-2 Game! ${winner.name} collected +${formatMoney(totalCollected)} (${formatMoney(amountPerPlayer)}/player)`);
      setTimeout(() => { uiState.lastAnimatedEntryId = null; }, 600);
    }

    /*************************************************************************
     * TAB 2: SETTLE UP (GREEDY MINIMUM-TRANSACTION DEBT SIMPLIFIER)
     *************************************************************************/
    function computeSimplifiedDebts(mode, specificSessionId = null) {
      const balances = {};
      appState.players.forEach(p => { balances[p.id] = 0; });

      if (mode === 'latest') {
        const targetId = specificSessionId || (appState.sessions.length > 0 ? appState.sessions[appState.sessions.length - 1].id : null);
        const session = appState.sessions.find(s => s.id === targetId);
        if (!session) return [];

        session.entries.forEach(e => {
          balances[e.playerId] = (balances[e.playerId] || 0) + (Number(e.net) || 0);
        });

        appState.settlements
          .filter(st => st.sessionId === session.id)
          .forEach(st => {
            balances[st.fromPlayerId] = (balances[st.fromPlayerId] || 0) + Number(st.amount);
            balances[st.toPlayerId] = (balances[st.toPlayerId] || 0) - Number(st.amount);
          });
      } else {
        appState.sessions.forEach(session => {
          session.entries.forEach(e => {
            balances[e.playerId] = (balances[e.playerId] || 0) + (Number(e.net) || 0);
          });
        });

        appState.settlements.forEach(st => {
          balances[st.fromPlayerId] = (balances[st.fromPlayerId] || 0) + Number(st.amount);
          balances[st.toPlayerId] = (balances[st.toPlayerId] || 0) - Number(st.amount);
        });
      }

      const debtors = [];
      const creditors = [];

      Object.entries(balances).forEach(([playerId, bal]) => {
        const rounded = Math.round(bal * 100) / 100;
        if (rounded < -0.01) debtors.push({ playerId, amount: Math.abs(rounded) });
        else if (rounded > 0.01) creditors.push({ playerId, amount: rounded });
      });

      const transfers = [];
      let safety = 0;

      while (debtors.length > 0 && creditors.length > 0 && safety < 200) {
        safety++;
        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const d = debtors[0];
        const c = creditors[0];
        const payAmount = Math.round(Math.min(d.amount, c.amount) * 100) / 100;

        if (payAmount > 0.01) {
          transfers.push({
            fromPlayerId: d.playerId,
            toPlayerId: c.playerId,
            amount: payAmount
          });
        }

        d.amount = Math.round((d.amount - payAmount) * 100) / 100;
        c.amount = Math.round((c.amount - payAmount) * 100) / 100;

        if (d.amount <= 0.01) debtors.shift();
        if (c.amount <= 0.01) creditors.shift();
      }

      return transfers;
    }

    function renderSettleUpTab() {
      if (appState.sessions.length === 0) {
        return `
          <div class="tab-enter text-center py-14 px-6 bg-[#182026] border border-white/[0.08] rounded-3xl mt-2">
            <div class="text-4xl mb-3">🤝</div>

            <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">Close a night on the Table tab and PokerCrew will calculate the fewest transfers needed to square everyone up.</p>
          </div>
        `;
      }

      const isLatest = uiState.settleMode === 'latest';
      const activeSessionObj = appState.sessions.find(s => s.id === uiState.selectedSettleSessionId)
        || appState.sessions[appState.sessions.length - 1];

      const transfers = computeSimplifiedDebts(
        isLatest ? 'latest' : 'alltime',
        activeSessionObj ? activeSessionObj.id : null
      );

      const relevantSettlements = isLatest
        ? appState.settlements.filter(st => st.sessionId === activeSessionObj.id)

      appState.settlements.push({
        id: 'pay_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        fromPlayerId,
        toPlayerId,
        amount: Number(amount),
        sessionId: sessionId || 'all_time',
        date: new Date().toISOString()
      });
      saveState();
      updateChromeUI();
      renderCurrentTab();

      const fromP = getPlayerById(fromPlayerId);
      const toP = getPlayerById(toPlayerId);
      showSnackbar(`Settled: ${fromP.name} paid ${toP.name} ${formatMoney(amount)} ✓`);

    function undoSettlement(settlementId) {
      appState.settlements = appState.settlements.filter(s => s.id !== settlementId);

      updateChromeUI();
      renderCurrentTab();
      showSnackbar('Payment reverted.');

    function copySettlementForWhatsApp() {
      const isLatest = uiState.settleMode === 'latest';
      const activeSessionObj = appState.sessions.find(s => s.id === uiState.selectedSettleSessionId)
        || appState.sessions[appState.sessions.length - 1];
      const transfers = computeSimplifiedDebts(
        isLatest ? 'latest' : 'alltime',
        activeSessionObj ? activeSessionObj.id : null
      );

      let lines = [];
      if (isLatest && activeSessionObj) {
        const pot = activeSessionObj.entries.reduce((s, e) => s + e.totalBuyIn, 0);
        const metaParts = [formatDateShort(activeSessionObj.date), `💰 Pot: ${formatMoney(pot)}`];
        if (activeSessionObj.handCount) metaParts.push(`🃏 ${activeSessionObj.handCount} hands`);
        if ((activeSessionObj.roundCount || 1) > 1) metaParts.push(`🔄 ${activeSessionObj.roundCount} rounds`);

        lines.push(`♠️ *POKERCREW — ${activeSessionObj.name.toUpperCase()}*`);
        lines.push(`📅 ${metaParts.join(' | ')}`);
        lines.push('');
        lines.push('*📊 Net Results:*');
        [...activeSessionObj.entries]
          .sort((a, b) => b.net - a.net)
          .forEach(e => {
            const p = getPlayerById(e.playerId);
            const icon = e.net > 0 ? '🟢' : e.net < 0 ? '🔴' : '⚪';
            lines.push(`${icon} ${p.avatar} ${p.name}: *${formatMoney(e.net, true)}*`);
          });
      } else {
        lines.push(`♠️ *POKERCREW — ALL-TIME BALANCES*`);
        lines.push(`📅 As of ${formatDateShort(new Date().toISOString())}`);
      }

      lines.push('');
      lines.push('*💸 Settle Up Transfers:*');
      if (transfers.length === 0) {
        lines.push('✅ Everyone is completely squared up!');
      } else {
        transfers.forEach(tr => {
          const payer = getPlayerById(tr.fromPlayerId);
          const receiver = getPlayerById(tr.toPlayerId);
          lines.push(`👉 ${payer.name} pays ${receiver.name}: *${formatMoney(tr.amount)}*`);
        });
      }

      copyToClipboard(lines.join('\n'), 'WhatsApp summary copied! Ready to paste 📋');

    function calculateLeaderboardStats() {
      const statsMap = {};
      appState.players.forEach(p => {
        statsMap[p.id] = {
          player: p,
          gamesPlayed: 0,
          wins: 0,
          totalBuyIn: 0,
          totalBuyInCount: 0,
          totalCashOut: 0,
          totalSideBonus: 0,
          netProfit: 0,
          worstSingleSession: 0,
          bestSingleSession: 0,
          badges: []
        };
      });

      appState.sessions.forEach(sess => {
        sess.entries.forEach(e => {
          if (!statsMap[e.playerId]) {
            statsMap[e.playerId] = {
              player: getPlayerById(e.playerId),
              gamesPlayed: 0,
              wins: 0,
              totalBuyIn: 0,
              totalBuyInCount: 0,
              totalCashOut: 0,
              totalSideBonus: 0,
              netProfit: 0,
              worstSingleSession: 0,
              bestSingleSession: 0,
              badges: []
            };
          }
          const st = statsMap[e.playerId];
          st.gamesPlayed += 1;
          if (e.net > 0) st.wins += 1;
          st.totalBuyIn += Number(e.totalBuyIn) || 0;
          st.totalBuyInCount += Number(e.buyInCount) || 1;
          st.totalCashOut += Number(e.cashOut) || 0;
          st.totalSideBonus += Number(e.sideBonus) || 0;
          st.netProfit = Number((st.netProfit + (Number(e.net) || 0)).toFixed(2));
          if (e.net < st.worstSingleSession) st.worstSingleSession = e.net;
          if (e.net > st.bestSingleSession) st.bestSingleSession = e.net;
        });
      });

      const list = Object.values(statsMap).map(st => ({
        ...st,
        winRate: st.gamesPlayed > 0 ? Math.round((st.wins / st.gamesPlayed) * 100) : 0,
        roi: st.totalBuyIn > 0 ? Math.round((st.netProfit / st.totalBuyIn) * 100) : 0
      }));

      list.sort((a, b) => b.netProfit - a.netProfit);

      const activePlayers = list.filter(st => st.gamesPlayed > 0);
      let awards = { shark: null, atm: null, heater: null, cooler: null };

      if (activePlayers.length > 0) {
        const topProfit = [...activePlayers].sort((a, b) => b.netProfit - a.netProfit)[0];
        if (topProfit && topProfit.netProfit > 0) {
          awards.shark = topProfit;
          topProfit.badges.push({ icon: '🦈', label: 'Table Shark' });
        }

        const topAtm = [...activePlayers].sort((a, b) => (b.totalBuyInCount - a.totalBuyInCount) || (b.totalBuyIn - a.totalBuyIn))[0];
        if (topAtm && topAtm.totalBuyIn > 0) {
          awards.atm = topAtm;
          topAtm.badges.push({ icon: '🏧', label: 'The ATM' });
        }

        const topHeater = [...activePlayers].sort((a, b) => (b.winRate - a.winRate) || (b.netProfit - a.netProfit))[0];
        if (topHeater && topHeater.winRate > 0) {
          awards.heater = topHeater;
          topHeater.badges.push({ icon: '🔥', label: 'On a Heater' });
        }

        const topCooler = [...activePlayers].sort((a, b) => a.worstSingleSession - b.worstSingleSession)[0];
        if (topCooler && topCooler.worstSingleSession < 0) {
          awards.cooler = topCooler;
          topCooler.badges.push({ icon: '🧊', label: 'Cooler Victim' });
        }
      }

      return { list, awards };
    }

    function renderProfitTrajectoryChart() {
      const palette = ['#10b981', '#f59e0b', '#38bdf8', '#f43f5e', '#a855f7', '#ec4899', '#14b8a6', '#eab308'];
      const sessions = appState.sessions;
      const players = appState.players;

      const series = players.map((p, idx) => {
        let cumulative = 0;
        const points = [{ sessionIdx: 0, label: 'Start', delta: 0, cumulative: 0 }];
        sessions.forEach((sess, sIdx) => {
          const entry = sess.entries.find(e => e.playerId === p.id);
          const delta = entry ? Number(entry.net) || 0 : 0;
          cumulative = Number((cumulative + delta).toFixed(2));
          points.push({
            sessionIdx: sIdx + 1,
            label: sess.name,
            date: formatDateShort(sess.date),
            delta,
            cumulative
          });
        });
        return { player: p, color: palette[idx % palette.length], points };
      });

      let minY = 0;
      let maxY = 0;
      series.forEach(s => {
        s.points.forEach(pt => {
          if (pt.cumulative < minY) minY = pt.cumulative;
          if (pt.cumulative > maxY) maxY = pt.cumulative;
        });
      });
      if (minY === 0 && maxY === 0) { minY = -50; maxY = 50; }
      const padY = Math.max(20, Math.round((maxY - minY) * 0.16));
      minY -= padY;
      maxY += padY;

      const W = 360;
      const H = 185;
      const padL = 44;
      const padR = 14;
      const padT = 16;
      const padB = 24;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const stepCount = Math.max(1, sessions.length);

      const getX = (idx) => padL + (idx / stepCount) * plotW;
      const getY = (val) => padT + ((maxY - val) / (maxY - minY)) * plotH;
      const zeroY = getY(0);

      const linesSvg = series.map(s => {
        const isFiltered = uiState.selectedChartPlayerId !== 'ALL' && uiState.selectedChartPlayerId !== s.player.id;
        const opacity = isFiltered ? 0.14 : 1;
        const strokeW = uiState.selectedChartPlayerId === s.player.id ? 3 : 2.2;
        const coords = s.points.map(pt => `${getX(pt.sessionIdx).toFixed(1)},${getY(pt.cumulative).toFixed(1)}`).join(' ');

        const dots = isFiltered ? '' : s.points.slice(1).map(pt => `
          <circle
            cx="${getX(pt.sessionIdx).toFixed(1)}"
            cy="${getY(pt.cumulative).toFixed(1)}"
            r="4.2"
            fill="#182026"
            stroke="${s.color}"
            stroke-width="2.2"
            class="cursor-pointer"
            onclick="selectChartTooltip('${s.player.id}', ${pt.sessionIdx})"
          />
        `).join('');

        return `
          <g style="opacity: ${opacity}; transition: opacity 0.2s ease;">
            <polyline fill="none" stroke="${s.color}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round" points="${coords}" />
            ${dots}
          </g>

    /*************************************************************************
     * BLIND CLOCK & WEB AUDIO CHIME
     *************************************************************************/
    function toggleBlindTimer() {
      if (timerRuntime.isRunning) pauseBlindTimer();
      else startBlindTimer();
      renderCurrentTab();
    }

    function startBlindTimer() {
      if (timerRuntime.isRunning) return;
      timerRuntime.isRunning = true;
      timerRuntime.intervalId = setInterval(() => {
        if (timerRuntime.secondsRemaining > 0) {
          timerRuntime.secondsRemaining -= 1;
          updateClockDomInPlace();
        } else {
          playBlindChime();
          const maxIdx = appState.timerSettings.levels.length - 1;
          if (timerRuntime.currentLevelIdx < maxIdx) {
            timerRuntime.currentLevelIdx += 1;
            timerRuntime.secondsRemaining = appState.timerSettings.levelDurationSec || 900;
            const lvl = appState.timerSettings.levels[timerRuntime.currentLevelIdx];
            showSnackbar(`🔔 Blinds Up! Level ${timerRuntime.currentLevelIdx + 1}: ${lvl.sb}/${lvl.bb}`);
          } else {
            pauseBlindTimer();
            showSnackbar('🔔 Final blind level reached!');
          }
          if (uiState.activeTab === 'tools') renderCurrentTab();
        }
      }, 1000);
    }

    function pauseBlindTimer() {
      timerRuntime.isRunning = false;
      if (timerRuntime.intervalId) {
        clearInterval(timerRuntime.intervalId);
        timerRuntime.intervalId = null;
      }
    }

    function resetBlindTimerLevel() {
      pauseBlindTimer();
      timerRuntime.secondsRemaining = appState.timerSettings.levelDurationSec || 900;
      renderCurrentTab();
    }

    function changeBlindLevel(delta) {
      const maxIdx = appState.timerSettings.levels.length - 1;
      timerRuntime.currentLevelIdx = Math.max(0, Math.min(maxIdx, timerRuntime.currentLevelIdx + delta));
      timerRuntime.secondsRemaining = appState.timerSettings.levelDurationSec || 900;
      renderCurrentTab();
    }

    function setBlindLevelDuration(seconds) {
      appState.timerSettings.levelDurationSec = seconds;
      timerRuntime.secondsRemaining = seconds;
      saveState();
      renderCurrentTab();
    }

    function updateBlindLevelField(idx, field, val) {
      const num = Math.max(0, Number(val) || 0);
      if (appState.timerSettings.levels[idx]) {
        appState.timerSettings.levels[idx][field] = num;
        saveState();
      }
    }

    function addBlindLevelRow() {
      const levels = appState.timerSettings.levels;
      const last = levels[levels.length - 1] || { sb: 50, bb: 100, ante: 10 };
      levels.push({ sb: last.sb * 2, bb: last.bb * 2, ante: (last.ante || 0) * 2 });
      saveState();
      renderCurrentTab();
    }

    function removeBlindLevelRow(idx) {
      if (appState.timerSettings.levels.length <= 1) return;
      appState.timerSettings.levels.splice(idx, 1);
      if (timerRuntime.currentLevelIdx >= appState.timerSettings.levels.length) {
        timerRuntime.currentLevelIdx = appState.timerSettings.levels.length - 1;
      }
      saveState();
      renderCurrentTab();
    }

    function updateClockDomInPlace() {
      if (uiState.activeTab !== 'tools') return;
      const digitsEl = document.getElementById('blind-clock-digits');
      const progEl = document.getElementById('blind-clock-progress');
      if (!digitsEl) return;
      const mins = Math.floor(timerRuntime.secondsRemaining / 60);
      const secs = timerRuntime.secondsRemaining % 60;
      digitsEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      if (timerRuntime.secondsRemaining <= 30) {
        digitsEl.classList.remove('text-white');
        digitsEl.classList.add('text-amber-400');
      } else {
        digitsEl.classList.add('text-white');
        digitsEl.classList.remove('text-amber-400');
      }
      if (progEl) {
        const totalDur = Math.max(1, appState.timerSettings.levelDurationSec || 900);
        const pct = Math.max(0, Math.min(100, (timerRuntime.secondsRemaining / totalDur) * 100));
        progEl.style.width = `${pct}%`;
      }
    }

    function playBlindChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const notes = [659.25, 987.77];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.22);

          gain.gain.setValueAtTime(0.001, now + i * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.28, now + i * 0.22 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.22 + 1.1);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.22);
          osc.stop(now + i * 0.22 + 1.15);
        });
      } catch (err) {
        console.warn('Web Audio chime unavailable:', err);
      }
    }

    /*************************************************************************
     * ARCHIVE, DEMO DATA RESET & JSON IMPORT/EXPORT
     *************************************************************************/
    function toggleHistoryExpand(sessionId) {
      uiState.expandedHistoryIds[sessionId] = !uiState.expandedHistoryIds[sessionId];
      renderCurrentTab();
    }

    function confirmDeleteSession(sessionId) {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-extrabold text-white">Delete Past Night?</h3>
          <p class="text-xs text-slate-400">This permanently removes this night and recalculates leaderboard standings and balances.</p>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="closeModal()" class="btn-press py-3 rounded-xl bg-[#202a32] text-slate-200 font-bold text-xs">Cancel</button>
            <button type="button" onclick="deleteSession('${sessionId}')" class="btn-press py-3 rounded-xl bg-rose-500 text-white font-extrabold text-xs">Delete Night</button>
          </div>
        </div>
      `);
    }

    function deleteSession(sessionId) {
      appState.sessions = appState.sessions.filter(s => s.id !== sessionId);
      appState.settlements = appState.settlements.filter(st => st.sessionId !== sessionId);
      saveState();
      closeModal();
      updateChromeUI();
      renderCurrentTab();
      showSnackbar('Night deleted from archive.');
    }

    function openClearDemoModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-xl">🧹</div>
            <div>
              <h3 class="text-base font-extrabold text-white">Clear Demo Data &amp; Start Clean</h3>
              <p class="text-xs text-slate-400">Wipe sample nights and debts to track your real crew.</p>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-2">
            <button type="button" onclick="executeClearAllData(true)"
              class="btn-press w-full py-3 px-4 rounded-xl bg-rose-500 text-white font-extrabold text-xs">
              Wipe Everything (Players &amp; History)
            </button>
            <button type="button" onclick="executeClearAllData(false)"
              class="btn-press w-full py-3 px-4 rounded-xl bg-[#202a32] border border-white/10 text-slate-200 font-bold text-xs">
              Clear Nights Only (Keep Friend Roster)
            </button>
            <button type="button" onclick="closeModal()"
              class="w-full py-2 text-xs font-semibold text-slate-400">
              Cancel
            </button>
          </div>
        </div>
      `);
    }

    function executeClearAllData(wipePlayers) {
      appState.isSampleData = false;
      appState.hasDismissedSampleBanner = true;
      appState.activeSession = null;
      appState.sessions = [];
      appState.settlements = [];
      if (wipePlayers) {
        appState.players = [];
        uiState.setupSelectedPlayerIds = [];
      } else {
        uiState.setupSelectedPlayerIds = appState.players.map(p => p.id);
      }
      saveState();
      closeModal();
      switchTab('live');
      showSnackbar(wipePlayers ? 'Clean slate ready! Add your friends below.' : 'Demo nights cleared.');
    }

    function confirmLoadSampleData() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-extrabold text-white">Load Demo Crew &amp; Nights?</h3>
          <p class="text-xs text-slate-400">Replaces current data with 5 sample friends, 4 nights, multi-round stats, and hand highlights.</p>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="closeModal()" class="btn-press py-3 rounded-xl bg-[#202a32] text-slate-200 font-bold text-xs">Cancel</button>
            <button type="button" onclick="appState = buildSampleData(); uiState.setupSelectedPlayerIds = appState.players.map(p => p.id); saveState(); closeModal(); updateChromeUI(); renderCurrentTab(); showSnackbar('Demo crew loaded!');"
              class="btn-press py-3 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">Load Demo Data</button>
          </div>
        </div>
      `);
    }

    function exportBackupJson() {
      const jsonStr = JSON.stringify(appState, null, 2);
      copyToClipboard(jsonStr, 'JSON backup copied to clipboard & downloading...');
      try {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `pokercrew-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        console.warn('Blob download fallback:', err);
      }
    }

    function openImportJsonModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-white">Import PokerCrew Backup</h3>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-xl bg-white/[0.06] text-slate-400">✕</button>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Choose .json File</label>
            <input type="file" accept=".json,application/json" onchange="handleImportFile(event)"
              class="block w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-500/20 file:text-emerald-300" />
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Or Paste Backup JSON</label>
            <textarea id="import-json-textarea" rows="4" placeholder='{"currency":"₪","players":[...]}'
              class="w-full bg-[#11171c] border border-white/10 rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none focus:border-emerald-500/50"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="closeModal()" class="btn-press py-3 rounded-xl bg-[#202a32] text-slate-300 font-bold text-xs">Cancel</button>
            <button type="button" onclick="importJsonFromText(document.getElementById('import-json-textarea').value)"
              class="btn-press py-3 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">Restore Backup</button>
          </div>
        </div>
      `);
    }

    function handleImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => importJsonFromText(e.target.result);
      reader.readAsText(file);
    }

    function importJsonFromText(rawText) {
      try {
        const parsed = JSON.parse(rawText);
        if (!parsed || !Array.isArray(parsed.players) || !Array.isArray(parsed.sessions)) {
          throw new Error('Invalid backup structure');
        }
        appState = {
          currency: parsed.currency || '₪',
          isSampleData: false,
          hasDismissedSampleBanner: true,
          hasDismissedRoundsTip: Boolean(parsed.hasDismissedRoundsTip),
          players: parsed.players,
          activeSession: parsed.activeSession || null,
          sessions: parsed.sessions,
          settlements: Array.isArray(parsed.settlements) ? parsed.settlements : [],
          timerSettings: parsed.timerSettings || appState.timerSettings
        };
        uiState.setupSelectedPlayerIds = appState.players.map(p => p.id);
        saveState();
        closeModal();
        updateChromeUI();
        renderCurrentTab();
        showSnackbar('Backup restored successfully! ✅');
      } catch (err) {
        showSnackbar('Invalid JSON backup file. Please check format.');
      }
    }

    /*************************************************************************
     * MODAL HELPERS & BOOTSTRAP
     *************************************************************************/
    function openModal(innerHtml) {
      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');
      if (!overlay || !card) return;
      card.innerHTML = innerHtml;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.classList.add('hidden');
    }

    function closeModalOnBackdrop(e) {
      if (e.target && e.target.id === 'modal-overlay') {
        closeModal();
      }
    }

    // Periodically refresh live Hands/Hr pace while a table is active
    setInterval(() => {
      if (appState.activeSession && uiState.activeTab === 'live') {
        const paceEl = document.getElementById('live-hands-pace');
        if (paceEl) paceEl.textContent = `(${computeHandsPerHour(appState.activeSession)})`;
      }
    }, 30000);

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      updateChromeUI();
      renderCurrentTab();
    });
  </script>
</body>
</html>
